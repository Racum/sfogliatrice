<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sfogliatrice WebAssembly Tessellation Test</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto 1fr;
      height: 100dvh;
      gap: 0;
    }
    header {
      grid-column: 1 / -1;
      grid-row: 1;
      padding: 0.75rem 1rem;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header h1 { margin: 0; font-size: 1rem; font-weight: 600; flex: 1; }
    #status { font-size: 0.8rem; opacity: 0.7; }
    #status.ready { color: #6ef075; opacity: 1; }
    #status.error  { color: #f07575; opacity: 1; }

    #config-bar {
      grid-column: 1 / -1;
      grid-row: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      padding: 0.6rem 1rem;
      background: #f4f4f4;
      border-bottom: 1px solid #ddd;
      border-top: 1px solid #ddd;
      align-items: flex-end;
    }

    #panels {
      grid-column: 1 / -1;
      grid-row: 3;
      display: flex;
      overflow: hidden;
      min-height: 0;
    }
    panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #resizer {
      width: 4px;
      background: #ddd;
      cursor: col-resize;
      flex-shrink: 0;
      transition: background 0.1s;
    }
    #resizer:hover, #resizer.dragging { background: #1a1a2e; }
    body.resizing { user-select: none; cursor: col-resize; }
    panel > .panel-label {
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #666;
      border-bottom: 1px solid #eee;
      background: #fafafa;
      flex-shrink: 0;
    }
    textarea {
      flex: 1;
      font-family: monospace;
      font-size: 0.8rem;
      border: none;
      outline: none;
      resize: none;
      padding: 0.75rem 1rem;
      overflow: auto;
    }

    /* Result panel tabs */
    .tab-bar {
      display: flex;
      border-bottom: 1px solid #eee;
      background: #fafafa;
      flex-shrink: 0;
    }
    .tab-bar button {
      padding: 0.45rem 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      margin-bottom: -1px;
    }
    .tab-bar button.active {
      color: #1a1a2e;
      border-bottom-color: #1a1a2e;
    }
    .tab-content { display: none; flex: 1; overflow: hidden; }
    .tab-content.active { display: flex; flex-direction: column; }

    #map { flex: 1; }

    #output {
      flex: 1;
      font-family: monospace;
      font-size: 0.8rem;
      white-space: pre;
      padding: 0.75rem 1rem;
      overflow: auto;
      background: #fdfdfd;
      color: #222;
    }
    #output.error { color: #c0392b; }

    .field { display: flex; flex-direction: column; gap: 2px; }
    .field label { font-size: 0.7rem; color: #555; white-space: nowrap; }
    .field input[type=number], .field input[type=text] {
      width: 7rem;
      padding: 0.25rem 0.4rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.8rem;
    }
    .field input[type=checkbox] { margin-top: 0.4rem; }
    button#run {
      align-self: flex-end;
      padding: 0.35rem 1.1rem;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
      margin-left: auto;
    }
    button#run:hover { background: #2d2d5e; }
    button#run:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Main parameter sliders ──────────────────────────────────────────── */
    .slider-field {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 130px;
    }
    .slider-field.wide { min-width: 180px; }
    .slider-label {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.7rem;
      color: #555;
      white-space: nowrap;
    }
    .slider-val { font-weight: 600; color: #222; }
    .auto-label {
      display: flex;
      align-items: center;
      gap: 0.2rem;
      margin-left: auto;
      cursor: pointer;
      font-size: 0.7rem;
      color: #555;
    }
    input[type=range] { width: 100%; cursor: pointer; accent-color: #1a1a2e; }
    input[type=range]:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Dual range */
    .dual-range-wrap {
      position: relative;
      height: 20px;
      display: flex;
      align-items: center;
    }
    .dual-track {
      position: absolute;
      left: 0; right: 0;
      height: 4px;
      background: #ddd;
      border-radius: 2px;
    }
    .dual-fill {
      position: absolute;
      height: 100%;
      background: #1a1a2e;
      border-radius: 2px;
    }
    .dual-range-wrap input[type=range] {
      position: absolute;
      width: 100%;
      background: transparent;
    }
    .dual-range-wrap input[type=range]::-webkit-slider-runnable-track { background: transparent; }
    .dual-range-wrap input[type=range]::-moz-range-track { background: transparent; }
    #min_strip_length { z-index: 1; }
    #max_strip_length { z-index: 2; }

    #advanced-wrap, #advanced-fields { display: contents; }
    #advanced-fields.hidden { display: none !important; }
    #advanced-toggle {
      align-self: flex-end;
      padding: 0.25rem 0.5rem;
      background: none;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #888;
      cursor: pointer;
      white-space: nowrap;
    }
    #advanced-toggle:hover { border-color: #999; color: #555; }

    /* Map layer toggle header */
    #map-controls {
      display: flex;
      gap: 1.25rem;
      padding: 0.4rem 1rem;
      background: #fafafa;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
    }
    #map-controls label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      color: #444;
      cursor: pointer;
      user-select: none;
    }
    #map-controls input[type=checkbox] { cursor: pointer; }

    #error-bar {
      font-size: 0.75rem;
      padding: 0 1rem;
      color: #c0392b;
      background: #fff0ee;
      border-bottom: 1px solid #f5c6c0;
      flex-shrink: 0;
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.15s ease, padding 0.15s ease;
    }
    #error-bar.visible {
      max-height: 2.5rem;
      padding: 0.35rem 1rem;
    }

    /* Leaflet attribution tweak */
    .leaflet-control-attribution { font-size: 0.6rem; }

    #map-footer {
      padding: 0.3rem 1rem;
      font-size: 0.75rem;
      color: #666;
      background: #fafafa;
      border-top: 1px solid #eee;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<header>
  <h1>Sfogliatrice WebAssembly Tessellation Test</h1>
</header>

<div id="config-bar">
  <div class="field">
    <label>Brute force</label>
    <input type="checkbox" id="brute_force">
  </div>
  <div class="slider-field">
    <div class="slider-label">Strip width <span class="slider-val" id="strip_width_val">5,000</span> m</div>
    <input type="range" id="strip_width" min="1000" max="20000" value="5000" step="100">
  </div>
  <div class="slider-field wide">
    <div class="slider-label">Strip length <span class="slider-val"><span id="min_strip_length_val">5,000</span>–<span id="max_strip_length_val">50,000</span></span> m</div>
    <div class="dual-range-wrap">
      <div class="dual-track"><div class="dual-fill" id="strip_length_fill"></div></div>
      <input type="range" id="min_strip_length" min="1000" max="100000" value="5000" step="500">
      <input type="range" id="max_strip_length" min="1000" max="100000" value="50000" step="500">
    </div>
  </div>
  <div class="slider-field">
    <div class="slider-label">Min. overlap <span class="slider-val" id="min_overlap_val">200</span> m</div>
    <input type="range" id="min_overlap" min="100" max="2000" value="200" step="10">
  </div>
  <div class="slider-field wide">
    <div class="slider-label">Heading <span class="slider-val" id="heading_val">auto</span>
      <label class="auto-label"><input type="checkbox" id="heading_auto" checked> auto</label>
    </div>
    <input type="range" id="heading" min="0" max="360" value="0" step="1" disabled>
  </div>
  <div id="advanced-wrap">
    <button id="advanced-toggle" type="button">Advanced ▸</button>
    <div id="advanced-fields" class="hidden">
      <div class="field"><label>Expansion (m)</label><input type="number" id="expansion"              value="5000"></div>
      <div class="field"><label>Shard density ratio</label><input type="number" id="shard_density_ratio" value="0.3" step="0.01"></div>
      <div class="field"><label>Shard radius (m)</label><input type="number" id="shard_radius"        value="50000"></div>
      <div class="field"><label>Force line targets</label><input type="checkbox" id="force_line_targets"></div>
      <div class="field"><label>Force square coverages</label><input type="checkbox" id="force_square_coverages"></div>
    </div>
  </div>
  <button id="run" disabled>Tessellate</button>
</div>

<div id="resizer"></div>

<panel>
  <div class="tab-bar">
    <button class="active" data-tab="map">Map</button>
    <button data-tab="raw">Raw</button>
  </div>
  <div id="tab-map" class="tab-content active">
    <div id="map-controls">
      <label><input type="checkbox" id="toggle-original" checked> Original</label>
      <label><input type="checkbox" id="toggle-targets"> Targets</label>
      <label><input type="checkbox" id="toggle-coverages" checked> Coverages</label>
      <label><input type="checkbox" id="toggle-intermediates"> Intermediates</label>
    </div>
    <div id="map"></div>
    <div id="map-footer">—</div>
  </div>
  <div id="tab-raw" class="tab-content">
    <div id="output">—</div>
  </div>
</panel>
</div><!-- #panels -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
  import init, { tessellate } from './pkg/sfogliatrice.js';

  // ── Map setup ──────────────────────────────────────────────────────────────
  const map = L.map('map', { zoomControl: true }).setView([41.9, 12.5], 8);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 20,
  }).addTo(map);

  const LAYER_STYLE = { color: '#000', weight: 1.5, fillColor: '#000', fillOpacity: 0.12 };
  const POINT_RADIUS = 6;

  function geojsonLayer(fc) {
    return L.geoJSON(fc, {
      style: () => LAYER_STYLE,
      pointToLayer: (_, latlng) =>
        L.circleMarker(latlng, { ...LAYER_STYLE, radius: POINT_RADIUS }),
    });
  }

  // One layer per data source; keyed by checkbox id suffix
  const layers = { original: null, intermediates: null, coverages: null, targets: null };

  function syncLayer(key) {
    const checked = document.getElementById('toggle-' + key).checked;
    const layer = layers[key];
    if (!layer) return;
    if (checked && !map.hasLayer(layer)) map.addLayer(layer);
    if (!checked && map.hasLayer(layer)) map.removeLayer(layer);
  }

  ['original', 'targets', 'coverages', 'intermediates'].forEach(key => {
    document.getElementById('toggle-' + key).addEventListener('change', () => syncLayer(key));
  });

  // ── Tabs ───────────────────────────────────────────────────────────────────
  document.querySelectorAll('.tab-bar button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'map') map.invalidateSize();
    });
  });

  // ── Helpers ────────────────────────────────────────────────────────────────
  const runBtn    = document.getElementById('run');
  const inputEl   = document.getElementById('input');
  const outputEl  = document.getElementById('output');
  const errorBar  = document.getElementById('error-bar');

  function showError(msg) {
    errorBar.textContent = msg;
    errorBar.classList.add('visible');
  }
  function clearError() {
    errorBar.textContent = '';
    errorBar.classList.remove('visible');
  }

  function num(id) {
    const v = parseFloat(document.getElementById(id).value);
    return isNaN(v) ? undefined : v;
  }
  function bool(id) { return document.getElementById(id).checked; }
  function heading() {
    return document.getElementById('heading_auto').checked
      ? undefined
      : parseFloat(document.getElementById('heading').value);
  }

  // ── Slider setup ───────────────────────────────────────────────────────────
  const fmt = n => Math.round(n).toLocaleString();

  document.getElementById('strip_width').addEventListener('input', function () {
    document.getElementById('strip_width_val').textContent = fmt(this.value);
  });
  document.getElementById('min_overlap').addEventListener('input', function () {
    document.getElementById('min_overlap_val').textContent = fmt(this.value);
  });

  // Dual range — strip length
  const dualMin  = document.getElementById('min_strip_length');
  const dualMax  = document.getElementById('max_strip_length');
  const dualFill = document.getElementById('strip_length_fill');

  function updateDual() {
    const lo = parseInt(dualMin.min), hi = parseInt(dualMax.max);
    const pMin = (parseInt(dualMin.value) - lo) / (hi - lo) * 100;
    const pMax = (parseInt(dualMax.value) - lo) / (hi - lo) * 100;
    dualFill.style.left  = pMin + '%';
    dualFill.style.width = (pMax - pMin) + '%';
    document.getElementById('min_strip_length_val').textContent = fmt(dualMin.value);
    document.getElementById('max_strip_length_val').textContent = fmt(dualMax.value);
  }
  dualMin.addEventListener('input', () => {
    if (parseInt(dualMin.value) > parseInt(dualMax.value)) dualMin.value = dualMax.value;
    updateDual();
  });
  dualMax.addEventListener('input', () => {
    if (parseInt(dualMax.value) < parseInt(dualMin.value)) dualMax.value = dualMin.value;
    updateDual();
  });

  // Raise whichever thumb the cursor is nearest to, so it captures the click
  dualMin.closest('.dual-range-wrap').addEventListener('mousemove', e => {
    const rect = dualMin.closest('.dual-range-wrap').getBoundingClientRect();
    const pos    = (e.clientX - rect.left) / rect.width;
    const lo     = parseInt(dualMin.min), hi = parseInt(dualMax.max);
    const minPos = (parseInt(dualMin.value) - lo) / (hi - lo);
    const maxPos = (parseInt(dualMax.value) - lo) / (hi - lo);
    dualMin.style.zIndex = Math.abs(pos - minPos) <= Math.abs(pos - maxPos) ? '3' : '1';
  });

  updateDual();

  // Heading toggle
  const headingAuto   = document.getElementById('heading_auto');
  const headingSlider = document.getElementById('heading');
  const headingVal    = document.getElementById('heading_val');

  function updateHeading() {
    const isAuto = headingAuto.checked;
    headingSlider.disabled = isAuto;
    headingVal.textContent = isAuto ? 'auto' : Math.round(headingSlider.value) + '°';
  }
  headingAuto.addEventListener('change', updateHeading);
  headingSlider.addEventListener('input', updateHeading);

  // ── Panel resizer ──────────────────────────────────────────────────────────
  const resizer   = document.getElementById('resizer');
  const leftPanel = resizer.previousElementSibling;

  resizer.addEventListener('mousedown', e => {
    e.preventDefault();
    resizer.classList.add('dragging');
    document.body.classList.add('resizing');

    const startX     = e.clientX;
    const startWidth = leftPanel.getBoundingClientRect().width;
    const minWidth   = 200;
    const maxWidth   = () => document.getElementById('panels').getBoundingClientRect().width - resizer.offsetWidth - minWidth;

    function onMove(e) {
      const w = Math.max(minWidth, Math.min(maxWidth(), startWidth + e.clientX - startX));
      leftPanel.style.flex = `0 0 ${w}px`;
      map.invalidateSize();
    }
    function onUp() {
      resizer.classList.remove('dragging');
      document.body.classList.remove('resizing');
      map.invalidateSize();
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // ── Advanced toggle ────────────────────────────────────────────────────────
  document.getElementById('advanced-toggle').addEventListener('click', () => {
    const fields = document.getElementById('advanced-fields');
    const btn = document.getElementById('advanced-toggle');
    const closing = !fields.classList.contains('hidden');
    fields.classList.toggle('hidden', closing);
    btn.textContent = closing ? 'Advanced ▸' : 'Advanced ▾';
  });

  // ── Area helpers ───────────────────────────────────────────────────────────
  function ringArea(coords) {
    let area = 0;
    const n = coords.length;
    for (let i = 0; i < n; i++) {
      const [lng1, lat1] = coords[i].map(v => v * Math.PI / 180);
      const [lng2, lat2] = coords[(i + 1) % n].map(v => v * Math.PI / 180);
      area += (lng2 - lng1) * (2 + Math.sin(lat1) + Math.sin(lat2));
    }
    return Math.abs(area) * 6371000 * 6371000 / 2;
  }

  function featureCollectionArea(fc) {
    let total = 0;
    for (const f of (fc.features ?? [])) {
      const g = f.geometry ?? f;
      if (g.type === 'Polygon') {
        total += ringArea(g.coordinates[0]);
      } else if (g.type === 'MultiPolygon') {
        for (const poly of g.coordinates) total += ringArea(poly[0]);
      }
    }
    return total;
  }

  function updateFooter(inputGeojson, result, elapsedMs) {
    const footer = document.getElementById('map-footer');
    const targetCount = (result.targets?.features ?? []).length;
    const inputArea = featureCollectionArea(
      inputGeojson.type === 'FeatureCollection' ? inputGeojson : { features: [{ geometry: inputGeojson }] }
    );
    const coverageArea = featureCollectionArea(result.coverages);
    const timePart = `${elapsedMs.toFixed(1)} ms`;
    if (inputArea > 0) {
      const fitting = (coverageArea / inputArea * 100).toFixed(1);
      footer.textContent = `Targets: ${targetCount}. Fitting: ${fitting}%. Time: ${timePart}`;
    } else {
      footer.textContent = `Targets: ${targetCount}. Time: ${timePart}`;
    }
  }

  // ── Run ────────────────────────────────────────────────────────────────────
  function run() {
    clearError();
    let geojson;
    try {
      geojson = JSON.parse(inputEl.value);
    } catch (e) {
      showError('JSON parse error: ' + e.message);
      return;
    }

    let result;
    let elapsedMs;
    try {
      const t0 = performance.now();
      result = tessellate(
        geojson,
        num('strip_width'), num('min_strip_length'), num('max_strip_length'),
        num('min_overlap'), num('expansion'), num('shard_density_ratio'),
        num('shard_radius'),
        bool('force_line_targets'), bool('force_square_coverages'),
        heading(),
        bool('brute_force'),
      );
      elapsedMs = performance.now() - t0;
    } catch (e) {
      showError(String(e));
      return;
    }

    outputEl.textContent = JSON.stringify(result, null, 2);

    // ── Map layers ────────────────────────────────────────────────────────────
    Object.values(layers).forEach(l => { if (l) map.removeLayer(l); });

    layers.original      = L.geoJSON(geojson, { style: () => LAYER_STYLE, pointToLayer: (_, ll) => L.circleMarker(ll, { ...LAYER_STYLE, radius: POINT_RADIUS }) });
    layers.intermediates = geojsonLayer(result.intermediates);
    layers.coverages     = geojsonLayer(result.coverages);
    layers.targets       = geojsonLayer(result.targets);

    ['original', 'intermediates', 'coverages', 'targets'].forEach(key => syncLayer(key));

    // Zoom to all features (use original + targets as the meaningful bounds)
    const bounds = L.latLngBounds([]);
    Object.values(layers).forEach(l => {
      try { bounds.extend(l.getBounds()); } catch (_) { /* empty */ }
    });
    if (bounds.isValid()) map.fitBounds(bounds, { padding: [24, 24] });

    updateFooter(geojson, result, elapsedMs);
  }

  runBtn.addEventListener('click', run);
  inputEl.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') run();
  });

  // ── Auto-run on any input change ──────────────────────────────────────────
  function debounce(fn, ms) {
    let t;
    return () => { clearTimeout(t); t = setTimeout(fn, ms); };
  }
  const debouncedRun = debounce(run, 400);
  const debouncedRunSlow = debounce(run, 800);

  document.querySelectorAll('#config-bar input').forEach(el => {
    el.addEventListener('input', debouncedRun);
  });
  inputEl.addEventListener('input', debouncedRunSlow);

  // ── WASM init ─────────────────────────────────────────────────────────────
  try {
    await init();
    runBtn.disabled = false;
    run();
  } catch (e) {
    showError('Failed to load WASM: ' + e);
    console.error(e);
  }
</script>
