[package]
name = "sfogliatrice_lib"
version = "0.1.0"
edition = "2024"
authors = ["Ronaldo Racum <ronaldo@racum.com>"]
license = "MIT"
description = "Tessellation of GeoJSON geometries into satellite survey targets and coverages."
readme = "../README.md"
keywords = ["geo", "geojson", "tessellation", "satellite"]
categories = ["science", "aerospace"]
homepage = "https://github.com/racum/sfogliatrice"
repository = "https://github.com/racum/sfogliatrice"

[dependencies]
geo = "0.33.0"
geo-omerc = "0.2.0"

[dev-dependencies]
serde_json = "1"
geojson = { version = "1.0.0", features = ["geo-types"] }
