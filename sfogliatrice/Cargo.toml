[package]
name = "sfogliatrice"
version = "0.1.0"
edition = "2024"
authors = ["Ronaldo Racum <ronaldo@racum.com>"]
license = "MIT"
description = "CLI tool to tessellate GeoJSON geometries into satellite survey targets and coverages."
homepage = "https://github.com/racum/sfogliatrice"
repository = "https://github.com/racum/sfogliatrice"
categories = ["science", "aerospace", "command-line-utilities"]
keywords = ["geo", "geojson", "tessellation", "satellite"]
readme = "../README.md"

[[bin]]
name = "sfogliatrice"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1"

[dependencies]
sfogliatrice_lib = { path = "../sfogliatrice_lib", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
geo = "0.33.0"
serde_json = "1"
geojson = { version = "1.0.0", features = ["geo-types"] }
