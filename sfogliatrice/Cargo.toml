[package]
name = "sfogliatrice"
version = "0.6.1"
edition = "2024"
authors = ["Ronaldo Ferreira <ronaldo@racum.com>"]
license = "MIT"
description = "CLI tool to tessellate GeoJSON geometries into satellite survey targets and coverages"
homepage = "https://github.com/racum/sfogliatrice"
repository = "https://github.com/racum/sfogliatrice"
categories = ["science", "aerospace", "command-line-utilities"]
keywords = ["geo", "geojson", "tessellation", "satellite"]
readme = "../README.md"

[[bin]]
name = "sfogliatrice"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1"

[dependencies]
sfogliatrice_lib = { path = "../sfogliatrice_lib", version = "0.6.1", features = ["parallel"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[build-dependencies]
winres = "0.1"

[package.metadata.deb]
maintainer = "Ronaldo Ferreira <ronaldo@racum.com>"
copyright = "2026, Ronaldo Ferreira"
license-file = ["../LICENSE", "0"]
extended-description = "CLI tool to tessellate GeoJSON geometries into satellite survey targets and coverages"
depends = ""
section = "science"
priority = "optional"
assets = [
    ["target/release/sfogliatrice", "usr/bin/", "755"],
    ["../README.md", "usr/share/doc/sfogliatrice/README.md", "644"],
]
