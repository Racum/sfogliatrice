[package]
name = "sfogliatrice_py"
version = "0.5.0"
edition = "2024"
authors = ["Ronaldo Racum <ronaldo@racum.com>"]
license = "MIT"
description = "Python bindings for sfogliatrice tessellation."
repository = "https://github.com/racum/sfogliatrice"
readme = "../README.md"
keywords = ["geo", "geojson", "tessellation", "satellite"]
categories = ["science", "aerospace"]
homepage = "https://github.com/racum/sfogliatrice"

[lib]
name = "sfogliatrice"
crate-type = ["cdylib"]

[dependencies]
sfogliatrice_lib = { path = "../sfogliatrice_lib", version = "0.5.0", features = ["parallel"] }
pyo3 = { version = "0.28", features = ["extension-module"] }
pythonize = "0.28"
serde_json = "1"
